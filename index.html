<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nathan Guilherme - 1 aninho</title>
<style>
  :root { --mel: #f6b21b; --fundo: #2b1a05; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--fundo); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  /* Cada "tela" ocupa a janela inteira; só uma fica ativa */
  .tela { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: var(--fundo); }
  .tela.ativa { display: flex; }

  /* Palco com a proporção exata das imagens (941x1672) para os cliques ficarem alinhados */
  .palco {
    position: relative;
    height: 100vh; height: 100dvh;
    aspect-ratio: 941 / 1672;
    max-width: 100vw;
    max-height: calc(100vw * 1672 / 941);
  }
  .palco img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }

  /* Áreas clicáveis (invisíveis) sobre as imagens */
  .zona { position: absolute; display: block; cursor: pointer; border-radius: 18px; background: transparent; border: 0; padding: 0; }
  .zona:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* Tela 1: qualquer ponto leva ao vídeo */
  #tela-inicio .zona { inset: 0; border-radius: 0; }

  /* Vídeo */
  #tela-video video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #pular {
    position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,.35); color: rgba(255,255,255,.85);
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; letter-spacing: .02em; cursor: pointer;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: background .2s, color .2s;
  }
  #pular:hover { background: rgba(0,0,0,.6); color: #fff; }

  /* Botão "clique aqui para voltar" no topo do interativo */
  #voltar-video {
    position: absolute; top: 2.2%; left: 50%; transform: translateX(-50%);
    background: rgba(255, 244, 214, .85); color: #5a3510;
    border: 1px solid rgba(90, 53, 16, .35); border-radius: 999px;
    padding: 6px 14px; font-size: clamp(11px, 1.6vh, 14px); font-weight: 600;
    cursor: pointer; white-space: nowrap; z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  #voltar-video:hover { background: #fff4d6; }

  /* Abelhinhas ao clicar */
  .abelha { position: fixed; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; z-index: 9999; will-change: transform, opacity; }
</style>
</head>
<body>

<!-- 1) Página inicial -->
<section class="tela ativa" id="tela-inicio" aria-label="Convite">
  <div class="palco">
    <img src="primeira.jpg" alt="Clique para abrir o convite">
    <a class="zona" href="#" data-ir="video" aria-label="Abrir convite"></a>
  </div>
</section>

<!-- 2) Vídeo -->
<section class="tela" id="tela-video" aria-label="Vídeo de introdução">
  <video id="video" src="video.mp4" playsinline preload="auto"></video>
  <button id="pular" type="button">Pule a introdução</button>
</section>

<!-- 3) Interativo -->
<section class="tela" id="tela-interativo" aria-label="Convite interativo">
  <div class="palco">
    <img src="interativo.jpg" alt="Convite de Nathan Guilherme">
    <button id="voltar-video" type="button">Clique aqui para voltar</button>

    <a class="zona" style="left:3.7%; top:78%; width:30.3%; height:15.8%"
       href="https://maps.app.goo.gl/yVMpU8pzhwvsv1sd7?g_st=aw" target="_blank" rel="noopener" aria-label="Localização"></a>

    <a class="zona" style="left:36.1%; top:78%; width:28.7%; height:15.8%"
       href="#" data-ir="presentes" aria-label="Sugestões de presentes"></a>

    <a class="zona" style="left:67%; top:78%; width:29.2%; height:15.8%"
       href="https://wa.link/fddls0" target="_blank" rel="noopener" aria-label="Confirmação de presença"></a>
  </div>
</section>

<!-- 4) Sugestões de presentes -->
<section class="tela" id="tela-presentes" aria-label="Sugestões de presentes">
  <div class="palco">
    <img src="presentes.jpg" alt="Sugestões de presentes: roupas tamanho 2 e brinquedos interativos">
    <a class="zona" style="left:2.2%; top:2.8%; width:28.5%; height:6.6%"
       href="#" data-ir="interativo" aria-label="Voltar"></a>
  </div>
</section>

<script>
(function () {
  var telas = {
    inicio: document.getElementById('tela-inicio'),
    video: document.getElementById('tela-video'),
    interativo: document.getElementById('tela-interativo'),
    presentes: document.getElementById('tela-presentes')
  };
  var video = document.getElementById('video');

  function mostrar(nome) {
    for (var k in telas) telas[k].classList.toggle('ativa', k === nome);
    if (nome !== 'video') video.pause();
  }

  function tocarVideo() {
    mostrar('video');
    try { video.currentTime = 0; } catch (e) {}
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () {          // se o navegador bloquear com som, tenta sem som
        video.muted = true;
        video.play().catch(function () {});
      });
    }
  }

  // Navegação interna (links com data-ir)
  document.addEventListener('click', function (e) {
    var alvo = e.target.closest('[data-ir]');
    if (!alvo) return;
    e.preventDefault();
    var destino = alvo.getAttribute('data-ir');
    if (destino === 'video') tocarVideo(); else mostrar(destino);
  });

  document.getElementById('pular').addEventListener('click', function () { mostrar('interativo'); });
  document.getElementById('voltar-video').addEventListener('click', tocarVideo);
  video.addEventListener('ended', function () { mostrar('interativo'); });
  // Se o vídeo não carregar, não deixa a pessoa travada
  video.addEventListener('error', function () { mostrar('interativo'); });

  // Pré-carrega as imagens das próximas telas
  ['interativo.jpg', 'presentes.jpg'].forEach(function (s) { var i = new Image(); i.src = s; });

  /* ---------- Abelhinhas a cada clique/toque ---------- */
  var SVG = '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">' +
    '<ellipse cx="14" cy="13" rx="9" ry="6" fill="#e8f6ff" stroke="#9ccbe6" stroke-width="1" transform="rotate(-25 14 13)"/>' +
    '<ellipse cx="25" cy="12" rx="9" ry="6" fill="#e8f6ff" stroke="#9ccbe6" stroke-width="1" transform="rotate(25 25 12)"/>' +
    '<ellipse cx="20" cy="24" rx="12" ry="9" fill="#ffc933" stroke="#3b2410" stroke-width="1.5"/>' +
    '<path d="M16 16.5v15M22 16v16" stroke="#3b2410" stroke-width="3.2" stroke-linecap="round"/>' +
    '<circle cx="31" cy="22" r="1.6" fill="#3b2410"/>' +
    '<path d="M32 17l3-4M34 19l4-2" stroke="#3b2410" stroke-width="1.2" stroke-linecap="round"/>' +
    '</svg>';

  function abelhas(x, y) {
    var qtd = 6;
    for (var i = 0; i < qtd; i++) {
      var el = document.createElement('div');
      el.className = 'abelha';
      el.innerHTML = SVG;
      var tam = 16 + Math.random() * 14;
      el.style.width = el.style.height = tam + 'px';
      document.body.appendChild(el);

      var ang = (Math.PI * 2 * i / qtd) + (Math.random() - .5) * .8;
      var dist = 60 + Math.random() * 90;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40;
      var zig = (Math.random() - .5) * 50;
      var rot = (Math.random() - .5) * 60;
      var x0 = x - tam / 2, y0 = y - tam / 2;
      var espelho = dx < 0 ? -1 : 1;

      var anim = el.animate([
        { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(.3) scaleX(' + espelho + ')', opacity: 0 },
        { transform: 'translate(' + (x0 + dx * .4 + zig) + 'px,' + (y0 + dy * .4) + 'px) scale(1) rotate(' + rot + 'deg) scaleX(' + espelho + ')', opacity: 1, offset: .25 },
        { transform: 'translate(' + (x0 + dx * .75 - zig) + 'px,' + (y0 + dy * .75) + 'px) scale(1) rotate(' + (-rot) + 'deg) scaleX(' + espelho + ')', opacity: 1, offset: .65 },
        { transform: 'translate(' + (x0 + dx) + 'px,' + (y0 + dy - 30) + 'px) scale(.6) scaleX(' + espelho + ')', opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: 'ease-out' });
      anim.onfinish = (function (n) { return function () { n.remove(); }; })(el);
    }
  }

  document.addEventListener('pointerdown', function (e) { abelhas(e.clientX, e.clientY); }, true);
})();
</script>
</body>
</html>
